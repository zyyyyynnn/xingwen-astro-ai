# Docker Compose 本地开发编排：品牌站、科研工作台、API 与 PostgreSQL。
#
# 服务启动顺序：postgres healthy → migrate(alembic upgrade head，一次性) → api → workspace/site。
# 服务名由 Compose Project 自动生成，不写固定 container_name，`docker compose -p <name>` 可完全隔离。

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xingwen_astro_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xingwen_astro_ai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-xingwen_astro_ai}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # APP_ENV 仅允许 development/integration/test；integration/test 才挂载 test-only bootstrap。
      APP_ENV: ${APP_ENV:-development}
      # 浏览器跨端口访问 API 时显式覆盖 env_file，确保自定义 Compose 端口一致。
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # ResearchRun、Artifact 与 Evidence 的当前权威存储固定为 PostgreSQL。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-xingwen_astro_ai}
      RESEARCH_INPUT_UPLOAD_DIR: /var/lib/xingwen/research-inputs
    volumes:
      - research_input_data:/var/lib/xingwen/research-inputs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  site:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_WORKSPACE_URL: ${PUBLIC_WORKSPACE_URL:-http://localhost:5173/workspace}
    ports:
      - "${SITE_PORT:-4321}:4321"
    command: ["pnpm", "--filter", "@xingwen/site", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  workspace:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      # 浏览器公开配置：仅为 API origin（不带 /api 路径），路径由生成的 operation metadata 提供；不得包含密钥。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:4321}
    ports:
      - "${WORKSPACE_PORT:-5173}:5173"
    command: ["pnpm", "--filter", "@xingwen/workspace", "dev"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  research_input_data:
