name: Benchmark current maintenance

on:
  push:
    branches:
      - codex/governance-authority-current-main
    paths:
      - .github/workflows/benchmark-current-maintenance.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync backend dependencies
        run: uv sync --project apps/api --frozen

      - name: Collapse benchmark history without changing scientific payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          schema_path = ROOT / 'apps/api/src/app/schemas/paper_benchmark.py'
          benchmark_path = ROOT / 'services/paper_pipeline/benchmarks/exoplanet_host_star/paper-reasoning-benchmark.json'


          class BenchmarkSchemaTransformer(ast.NodeTransformer):
              def visit_ClassDef(self, node: ast.ClassDef):
                  if node.name == 'BenchmarkChangeRecord':
                      return None
                  if node.name == 'BenchmarkReviewRecord':
                      node.body = [
                          item
                          for item in node.body
                          if not (
                              isinstance(item, ast.AnnAssign)
                              and isinstance(item.target, ast.Name)
                              and item.target.id in {'review_sequence', 'supersedes_review_id'}
                          )
                      ]
                  if node.name == 'BenchmarkPackage':
                      new_body = []
                      for item in node.body:
                          if (
                              isinstance(item, ast.AnnAssign)
                              and isinstance(item.target, ast.Name)
                              and item.target.id == 'change_records'
                          ):
                              continue
                          if (
                              isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and 'change_records' in (ast.get_source_segment(schema_source, item) or '')
                          ):
                              # Remove only validators/projections whose sole purpose is
                              # machine change history; other package validators remain.
                              segment = ast.get_source_segment(schema_source, item) or ''
                              if any(token in segment for token in ('change_records', 'BenchmarkChangeRecord')):
                                  continue
                          new_body.append(item)
                      node.body = new_body
                  return self.generic_visit(node)

              def visit_FunctionDef(self, node: ast.FunctionDef):
                  if node.name == '_effective_review_records':
                      return None
                  return self.generic_visit(node)

              def visit_Call(self, node: ast.Call):
                  node = self.generic_visit(node)
                  if (
                      isinstance(node.func, ast.Name)
                      and node.func.id == '_effective_review_records'
                      and len(node.args) == 1
                  ):
                      return node.args[0]
                  return node


          schema_source = schema_path.read_text(encoding='utf-8')
          tree = ast.parse(schema_source)
          tree = BenchmarkSchemaTransformer().visit(tree)
          ast.fix_missing_locations(tree)
          transformed = ast.unparse(tree) + '\n'

          # The current package has exactly one scientific review. Make that a
          # schema invariant rather than reconstructing a history chain.
          transformed, count = re.subn(
              r'(review_records:\s*tuple\[BenchmarkReviewRecord,\s*\.\.\.\]\s*=\s*Field\(min_length=1)(\))',
              r'\1, max_length=1\2',
              transformed,
              count=1,
          )
          if count != 1:
              raise RuntimeError('BenchmarkPackage.review_records field shape was not recognized')
          if any(
              token in transformed
              for token in (
                  'review_sequence',
                  'supersedes_review_id',
                  'BenchmarkChangeRecord',
                  'change_records',
                  '_effective_review_records',
              )
          ):
              raise RuntimeError('historical benchmark machinery remains in schema')
          ast.parse(transformed)
          schema_path.write_text(transformed, encoding='utf-8')

          payload = json.loads(benchmark_path.read_text(encoding='utf-8'))
          reviews = payload.get('review_records')
          if not isinstance(reviews, list) or len(reviews) != 1:
              raise RuntimeError('benchmark must contain exactly one current scientific review')
          review = reviews[0]
          review.pop('review_sequence', None)
          review.pop('supersedes_review_id', None)
          payload.pop('change_records', None)

          # Preserve the scientific identity. Only repository-history metadata
          # is being removed in this maintenance step.
          old_scientific_hash = payload['scientific_payload_hash']
          old_benchmark_version = payload['benchmark_version']
          if review['reviewed_benchmark_version'] != old_benchmark_version:
              raise RuntimeError('current scientific review is not bound to benchmark_version')
          if review['reviewed_content_hash'] != old_scientific_hash:
              raise RuntimeError('current scientific review is not bound to scientific_payload_hash')

          # Recompute the package content hash using the authoring hash helper.
          # Validate with a temporary syntactic load after updating the hash.
          from hashlib import sha256
          canonical = dict(payload)
          canonical.pop('content_hash', None)
          serialized = json.dumps(
              canonical,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8')
          payload['content_hash'] = 'sha256:' + sha256(serialized).hexdigest()
          benchmark_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # Delete history-only tests, not scientific/admission tests.
          test_path = ROOT / 'apps/api/tests/test_paper_benchmark.py'
          source = test_path.read_text(encoding='utf-8')
          test_tree = ast.parse(source)
          lines = source.splitlines(keepends=True)
          replacements = []
          historical_tokens = {
              'review_sequence',
              'supersedes_review_id',
              'BenchmarkChangeRecord',
              'change_records',
              '_effective_review_records',
          }
          for node in test_tree.body:
              if isinstance(node, ast.ImportFrom):
                  names = [
                      alias
                      for alias in node.names
                      if alias.name not in {'BenchmarkChangeRecord'}
                  ]
                  if len(names) != len(node.names):
                      if names:
                          replacement = ast.ImportFrom(
                              module=node.module,
                              names=names,
                              level=node.level,
                          )
                          replacements.append(
                              (node.lineno, node.end_lineno or node.lineno, ast.unparse(replacement) + '\n')
                          )
                      else:
                          replacements.append((node.lineno, node.end_lineno or node.lineno, ''))
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  segment = ast.get_source_segment(source, node) or ''
                  if any(token in segment for token in historical_tokens):
                      replacements.append((node.lineno, node.end_lineno or node.lineno, ''))
          for start, end, replacement in sorted(replacements, reverse=True):
              lines[start - 1:end] = [replacement]
          updated_tests = ''.join(lines)
          ast.parse(updated_tests)
          test_path.write_text(updated_tests, encoding='utf-8')

          # Remove machine-history prose from benchmark docs and hash-projection
          # assertions without weakening scientific review semantics.
          for path in (
              ROOT / 'services/paper_pipeline/benchmarks/README.md',
              ROOT / 'packages/schemas/README.md',
          ):
              if not path.exists():
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              kept = [
                  line
                  for line in lines
                  if not any(
                      token in line
                      for token in (
                          'change_records',
                          'BenchmarkChangeRecord',
                          'review_sequence',
                          'supersedes_review_id',
                          '_effective_review_records',
                      )
                  )
              ]
              path.write_text(''.join(kept), encoding='utf-8')
          PY

          PYTHONPATH=apps/api/src uv run --project apps/api python - <<'PY'
          from services.paper_pipeline.benchmark import load_frozen_benchmark

          package = load_frozen_benchmark()
          assert len(package.review_records) == 1
          review = package.review_records[0]
          assert review.reviewed_benchmark_version == package.benchmark_version
          assert review.reviewed_content_hash == package.scientific_payload_hash
          print(package.content_hash)
          PY

          uv run --project apps/api pytest apps/api/tests/test_paper_benchmark.py -q
          git diff --check

      - name: Remove maintenance workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/benchmark-current-maintenance.yml
          rm -f .github/workflows/repository-maintenance.yml
          rm -f .github/workflows/one-time-delegacy-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(benchmark): keep current scientific review only"
          git push origin HEAD:codex/governance-authority-current-main
