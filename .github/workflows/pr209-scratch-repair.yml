name: PR209 isolated repair workspace

on:
  push:
    branches:
      - codex/pr209-final-repair-scratch

permissions:
  contents: write

concurrency:
  group: pr209-isolated-repair
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xingwen_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xingwen_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xingwen_test_db
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xingwen_test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr209-final-repair-scratch
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Sync dependencies
        run: |
          uv sync --project apps/api --frozen
          pnpm install --frozen-lockfile

      - name: Apply isolated repair transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr209_scratch_repair.py')
          text = path.read_text(encoding='utf-8')
          old = '''                node.args.kwonlyargs = [\n                    arg for arg in node.args.kwonlyargs if arg.arg not in {"sequence", "supersedes"}\n                ]\n                # Keep defaults aligned with keyword-only arguments.\n                original_pairs = list(zip(node.args.kwonlyargs, node.args.kw_defaults))\n                node.args.kwonlyargs = [pair[0] for pair in original_pairs]\n                node.args.kw_defaults = [pair[1] for pair in original_pairs]\n'''
          new = '''                original_pairs = list(zip(node.args.kwonlyargs, node.args.kw_defaults))\n                kept_pairs = [\n                    pair\n                    for pair in original_pairs\n                    if pair[0].arg not in {"sequence", "supersedes"}\n                ]\n                node.args.kwonlyargs = [pair[0] for pair in kept_pairs]\n                node.args.kw_defaults = [pair[1] for pair in kept_pairs]\n'''
          if old not in text:
              raise SystemExit('scratch repair helper signature block drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/pr209_scratch_repair.py
          git diff --check

      - name: Fast Python import and compile smoke
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          import app.main
          from app.services.research import ResearchApplicationService
          from app.routers import research
          from app.schemas import core
          print('research import boundary: OK')
          PY
          uv run python -m compileall -q src tests

      - name: Upgrade fresh PostgreSQL baseline
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Run backend suite
        working-directory: apps/api
        run: uv run pytest -m "not scientific_document_native"

      - name: Run deterministic research benchmarks twice
        shell: bash
        run: |
          mkdir -p .artifacts/repair-a .artifacts/repair-b
          for out in repair-a repair-b; do
            uv run --project apps/api python -m services.paper_pipeline.claim_benchmark \
              --output ".artifacts/$out/literature-claim.json"
            uv run --project apps/api python -m services.paper_pipeline.relation_benchmark \
              --cases-output ".artifacts/$out/literature-relation-cases.json" \
              --output ".artifacts/$out/literature-relation.json"
            uv run --project apps/api python -m services.graph_pipeline.benchmark \
              --cases-output ".artifacts/$out/evidence-graph-cases.json" \
              --output ".artifacts/$out/evidence-graph.json"
          done
          diff -r .artifacts/repair-a .artifacts/repair-b

      - name: Check generated schemas and contracts
        working-directory: apps/api
        shell: bash
        run: |
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/data_pipeline \
            --include DataSourceCompletion --include CrossmatchInput --include CrossmatchResult \
            --include CrossmatchBenchmarkManifest --include CrossmatchBenchmarkReport \
            --include DataArtifactBuildInput --include DatasetArtifactCandidate \
            --include FieldDictionaryArtifactCandidate --include SourceCollectionArtifactCandidate \
            --include MappingRuleSet --include UnitConversionCatalog --include DataQualityRuleSet \
            --include QualityEvaluationPlan --include QualityMetricPlan \
            --include DataQualityEvaluationInput --include DataQualityEvaluationResult \
            --include DataQualityEvaluationRejected --include FieldQualityResult \
            --include RowQualityResult --include DatasetQualityResult \
            --include ResearchContractQualityGate --include QualityConstraintResult \
            --include QualityMetricResult --check
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/literature_claim \
            --include LiteratureClaimExtractionOutput --include LiteratureClaimCandidate \
            --include LiteratureClaimAdmissionResult --include LiteratureClaimsCandidate \
            --include LiteratureClaimBenchmarkEvaluationCase --include LiteratureClaimBenchmarkReport --check
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/literature_relation \
            --include LiteratureRelationExtractionOutput --include LiteratureRelationCandidate \
            --include LiteratureRelationAdmissionResult --include LiteratureRelationsCandidate \
            --include LiteratureReasoningTraceCandidate --include LiteratureRelationBenchmarkEvaluationCase \
            --include LiteratureRelationBenchmarkReport --check
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/graph \
            --include GraphBuildRequest --include GraphIntegrityReport --include GraphArtifactCandidate \
            --include GraphAdmissionResult --include GraphBenchmarkReport --check
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/core --include-openapi --check
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/scientific_document \
            --include ScientificDataExtractionCandidate --include DocumentParseCandidate \
            --include DocumentParseProfile --include DocumentLocator --include DocumentFigure \
            --include DocumentTable --include DocumentTableCell --include GoldenExpectedAnnotation \
            --include GoldenSetEntry --include GoldenSetManifest --include BenchmarkMetricValue \
            --include BenchmarkCaseResult --include BenchmarkReport --check
          uv run python ../../scripts/export_schemas.py --output ../../packages/schemas/generated/security \
            --include ResearchSession --include SessionCreated --include CreateSessionRequest \
            --include CsrfTokenResponse --check

      - name: Validate repository, docs, architecture and frontend
        shell: bash
        run: |
          pnpm --filter @xingwen/contracts sync-contracts
          git diff --exit-code -- packages/contracts/src/generated
          python -m unittest scripts.test_check_foundation
          python scripts/check_foundation.py
          node scripts/check-architecture-delegacy.mjs
          node --test scripts/check-architecture-delegacy.test.mjs
          node scripts/check-docs.mjs
          node --test scripts/check-docs.test.mjs
          pnpm check
          git diff --check

      - name: Validate Compose and browser integration
        shell: bash
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.integration.yml config --quiet
          docker compose -p xingwen-pr209-repair -f docker-compose.yml -f docker-compose.integration.yml \
            up --build --detach --wait --remove-orphans
          pnpm test:e2e:integration
        env:
          COMPOSE_PROJECT_NAME: xingwen-pr209-repair

      - name: Tear down isolated Compose project
        if: always()
        shell: bash
        run: |
          docker compose -p xingwen-pr209-repair -f docker-compose.yml -f docker-compose.integration.yml \
            down --volumes --remove-orphans || true

      - name: Commit clean validated tree to scratch branch
        if: success()
        shell: bash
        run: |
          test ! -e scripts/pr209_scratch_repair.py
          test ! -e .github/workflows/pr209-scratch-repair.yml
          git status --short
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(repo): materialize final current architecture"
          git push origin HEAD:codex/pr209-final-repair-scratch

      - name: Show repair diff summary on failure
        if: failure()
        shell: bash
        run: |
          git status --short || true
          git diff --stat || true
          git diff --check || true
