name: PR209 repair artifact generator

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr209-generate-artifacts.yml
      - apps/api/src/app/contracts/**
      - scripts/export_openapi.py

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync API environment
        run: uv sync --project apps/api --frozen

      - name: Regenerate deterministic backend artifacts
        run: |
          uv run --project apps/api python -m services.paper_pipeline.demo_fixture
          uv run --project apps/api python -m services.paper_pipeline.demo_summary_fixture
          cd apps/api
          uv run python ../../scripts/export_openapi.py \
            --output ../../packages/schemas/generated/core/openapi.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend toolchain
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting and sync consumers
        run: |
          pnpm exec prettier --write \
            packages/data-access/src/fixture/paper-acquisition.fixture.json \
            packages/data-access/src/fixture/paper-summary.fixture.json \
            packages/schemas/generated/core/openapi.json \
            scripts/check-architecture-delegacy.mjs \
            scripts/check-docs-rules.mjs \
            scripts/check-docs.mjs \
            scripts/check-docs.test.mjs \
            scripts/governance-identifiers.mjs
          pnpm --filter @xingwen/contracts sync-contracts

      - name: Upload generated repair files
        uses: actions/upload-artifact@v4
        with:
          name: pr209-repair-files-current
          if-no-files-found: error
          path: |
            packages/data-access/src/fixture/paper-acquisition.fixture.json
            packages/data-access/src/fixture/paper-summary.fixture.json
            packages/schemas/generated/core/openapi.json
            packages/contracts/src/generated/core/dto.ts
            packages/contracts/src/generated/core/manifest.json
            scripts/check-architecture-delegacy.mjs
            scripts/check-docs-rules.mjs
            scripts/check-docs.mjs
            scripts/check-docs.test.mjs
            scripts/governance-identifiers.mjs

      - name: Verify generated repair set
        run: |
          uv run --project apps/api pytest \
            apps/api/tests/test_paper_acquisition_fixture.py \
            apps/api/tests/test_paper_summary_fixture.py \
            apps/api/tests/test_api_surface.py -q
          cd apps/api
          uv run python ../../scripts/export_openapi.py \
            --output ../../packages/schemas/generated/core/openapi.json --check
          cd ../..
          pnpm format:check
          pnpm --filter @xingwen/contracts sync-contracts
          git diff --exit-code -- packages/contracts/src/generated/core
