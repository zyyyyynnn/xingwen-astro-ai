name: One-shot PR 166 Evidence mapping fixture fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: ${{ github.event.issue.number == 166 && github.event.comment.body == '/agent-fix-pr166-evidence-map' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b-08-claim-relation-trace-api
          fetch-depth: 0

      - name: Use atomic Snapshot map for Evidence bindings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/test_literature_artifacts_postgres.py")
          text = path.read_text(encoding="utf-8")
          old = "            persisted_source_snapshot_id=snapshot_ids[item.source_snapshot_id],\n"
          new = "            persisted_source_snapshot_id=atomic_snapshot_ids[item.source_snapshot_id],\n"
          if text.count(old) != 1:
              raise RuntimeError("Evidence Snapshot map anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check
          git add apps/api/tests/test_literature_artifacts_postgres.py
          git commit -m "test(b08): bind atomic Evidence to materialized snapshots"
          git push origin HEAD:feat/b-08-claim-relation-trace-api

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 166,
              body: `PR #166 Evidence mapping fixture repair failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
