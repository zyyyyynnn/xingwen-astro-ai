name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository foundation
        run: |
          python -m unittest scripts.test_check_foundation
          python scripts/check_foundation.py

      - name: Validate Docker Compose contract
        run: |
          cp .env.example .env
          docker compose config --quiet

  backend:
    name: Backend tests and schema export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run pytest

      - name: Check Phase 0 v1 Pydantic contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/v1-phase0
          --include DatasetResponse
          --include ColumnInfo
          --include QualityScore
          --include SourceRecordItem
          --include PaperSearchQuery
          --include PaperAcquisitionRun
          --include PaperCandidate
          --include PaperSummary
          --include LiteratureClaim
          --include LiteratureRelation
          --include ReasoningTrace
          --include EvidenceResponse
          --include SourceSnapshot
          --check

      - name: Check v2 core contracts
        run: |
          uv run python ../../scripts/export_schemas.py \
            --output ../../packages/schemas/generated/v2-core \
            --include ResearchProject \
            --include ResearchContractDraft \
            --include ResearchContract \
            --include ResearchRun \
            --include RunEvent \
            --include ResearchArtifact \
            --include ArtifactVersion \
            --include ResearchArtifactDetail \
            --include ArtifactVersionDetail \
            --include PaperCollectionRead \
            --include PaperCollectionCandidateRead \
            --include EvidenceRead \
            --include SourceSnapshotDetail \
            --include WorkspaceSnapshot \
            --include ShareSnapshot \
            --include ShareSnapshotCreated \
            --include PublicShareSnapshot \
            --check
          uv run python ../../scripts/export_v2_openapi.py \
            --output ../../packages/schemas/generated/v2-core/openapi.json \
            --check

      - name: Check v2 session security contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/v2-security
          --include ResearchSession
          --include SessionCreated
          --include SessionQuota
          --include ProblemDetails
          --check

  frontend:
    name: Frontend quality and entrypoint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated v2 transport contracts
        run: |
          pnpm --filter @xingwen/contracts sync-contracts
          git diff --exit-code -- packages/contracts/src/generated/v2-core

      - name: Check formatting
        run: pnpm format:check

      - name: Check documentation governance
        run: pnpm check:docs

      - name: Lint frontend workspace
        run: pnpm lint

      - name: Typecheck apps and shared packages
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build site and workspace
        run: pnpm build

      - name: Check package architecture
        run: pnpm check:architecture

      - name: Check retired runtime removal
        run: pnpm check:legacy

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend entrypoint smoke
        run: pnpm test:e2e
