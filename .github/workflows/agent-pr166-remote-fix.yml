name: One-shot PR 166 remote fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    if: ${{ github.event.issue.number == 166 && github.event.comment.body == '/agent-fix-pr166' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/b-08-claim-relation-trace-api
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Merge main and apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "merge failed without resolvable conflicts"
              exit "$merge_status"
            fi
            for path in "${conflicts[@]}"; do
              git checkout --theirs -- "$path"
              git add -- "$path"
            done
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          python scripts/.agent_fix_pr166.py
          git rm -f \
            .github/workflows/agent-fix-pr166.yml \
            .github/workflows/agent-pr166-remote-fix.yml \
            scripts/.agent_fix_pr166.py
          git diff --check

      - name: Validate focused backend changes
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          uv sync --frozen
          uv run pytest -q \
            tests/test_artifact_publisher.py \
            tests/test_literature_claim_pipeline.py \
            tests/test_literature_relation_pipeline.py \
            tests/test_literature_artifact_api.py
          uv run python -m compileall -q src tests
          cd ../..
          python scripts/check_foundation.py
          git diff --check

      - name: Commit and push resolved branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(b08): close publication and provenance review [agent-fixed-pr166]"
          git push origin HEAD:feat/b-08-claim-relation-trace-api
          new_head=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/issues/166/comments \
            -f body="PR #166 remote repair completed at HEAD \`${new_head}\`. Focused tests and foundation checks passed."

      - name: Report repair failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 166,
              body: `PR #166 remote repair workflow failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
