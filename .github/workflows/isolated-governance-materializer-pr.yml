name: Isolated governance materializer PR trigger

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/pr209-final-repair-scratch' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr209-final-repair-scratch
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.8'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract isolated materializer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/isolated-governance-materializer.yml').read_text(encoding='utf-8')

          materialize_marker = "      - name: Materialize current-only architecture\n        shell: bash\n        run: |\n"
          commit_marker = "      - name: Commit clean candidate tree\n        shell: bash\n        run: |\n"

          materialize_start = source.index(materialize_marker) + len(materialize_marker)
          materialize_end = source.index("\n      - name: Commit clean candidate tree", materialize_start)
          materialize = textwrap.dedent(source[materialize_start:materialize_end])

          old = ' or rel == ".github/pull_request_template.md" or not path.is_file():'
          new = ' or rel == ".github/pull_request_template.md" or rel in {"scripts/check-architecture-delegacy.mjs", "scripts/check-architecture-delegacy.test.mjs", "scripts/check_foundation.py", "scripts/test_check_foundation.py"} or not path.is_file():'
          if materialize.count(old) != 1:
              raise SystemExit(f'materializer static sweep anchor count: {materialize.count(old)}')
          materialize = materialize.replace(old, new, 1)

          commit_start = source.index(commit_marker) + len(commit_marker)
          commit = textwrap.dedent(source[commit_start:])

          Path('/tmp/pr209-materialize.sh').write_text(materialize, encoding='utf-8')
          Path('/tmp/pr209-commit.sh').write_text(commit, encoding='utf-8')
          PY

      - name: Materialize and commit clean tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/isolated-governance-materializer.yml \
                       .github/workflows/isolated-governance-materializer-pr.yml

          python - <<'PY'
          from pathlib import Path

          def rewrite(path_text: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'anchor missing in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')

          # Remove the retired workflow feature flag from current runtime/test fixtures.
          rewrite(
              'apps/api/src/app/routers/test_bootstrap.py',
              [(
                  '            "The test-only bootstrap requires the persistent runtime "\n            "(DATABASE_URL and PERSISTENT_WORKFLOW_ENABLED=true)"\n',
                  '            "The test-only bootstrap requires the configured PostgreSQL runtime "\n            "(DATABASE_URL)"\n',
              )],
          )
          rewrite(
              'apps/api/tests/test_research_input_security.py',
              [('    monkeypatch.setattr(settings, "PERSISTENT_WORKFLOW_ENABLED", False)\n', '')],
          )
          rewrite(
              'apps/api/tests/test_snapshot_contract.py',
              [('    monkeypatch.setattr(settings, "PERSISTENT_WORKFLOW_ENABLED", False)\n', '')],
          )
          rewrite(
              'apps/api/tests/test_real_integration_postgres.py',
              [
                  ('    monkeypatch.setattr(settings, "PERSISTENT_WORKFLOW_ENABLED", True)\n', ''),
                  (
                      '                updated_at=NOW,\n            )\n        )\n        session.add(\n            ResearchContractDraftModel(',
                      '                updated_at=NOW,\n                idempotency_key="fixture-project",\n                request_hash="sha256:" + "a" * 64,\n            )\n        )\n        session.add(\n            ResearchContractDraftModel(',
                  ),
                  (
                      '                expires_at=datetime.now(UTC) + timedelta(hours=1),\n            )\n        )\n',
                      '                expires_at=datetime.now(UTC) + timedelta(hours=1),\n                idempotency_key="fixture-draft",\n                request_hash="sha256:" + "b" * 64,\n            )\n        )\n',
                  ),
              ],
          )

          # Remove retired read-surface vocabulary from current authoring sources.
          rewrite(
              'apps/api/src/app/schemas/graph_artifact.py',
              [(
                  'This module is the only Pydantic authoring source for publisher-ready Graph\nartifacts. The :mod:`app.schemas.graph` models are task-read DTOs and\nintentionally cannot satisfy this publication contract.\n',
                  'This module is the only Pydantic authoring source for publisher-ready Evidence\nGraph artifacts. Only its sealed typed candidate can satisfy this publication contract.\n',
              )],
          )
          rewrite(
              'docs/engineering/LITERATURE_CLAIM_PIPELINE.md',
              [(
                  '`LiteratureClaimsCandidate@1.0.0` 才是领域 typed candidate。task-read\n`app.schemas.reasoning.LiteratureClaim`、`LiteratureReasoningResponse` 和 core\n`LiteratureClaimsArtifactContent` 是当前读取投影，带不可发布 marker，不是第二套编写源。\n',
                  '`LiteratureClaimsCandidate@1.0.0` 才是领域 typed candidate。core\n`LiteratureClaimsArtifactContent` 仅表达当前读取投影，不是第二套编写源，也不能进入 Publisher。\n',
              )],
          )
          rewrite(
              'docs/engineering/LITERATURE_RELATION_PIPELINE.md',
              [
                  (
                      'HTTP OpenAPI。task-read `app.schemas.reasoning.LiteratureRelation`/`ReasoningTrace` 与\ncore `LiteratureRelationsArtifactContent`/`ReasoningTracesArtifactContent` 是当前读取投影，\n不是编写源，也不能进入 Publisher。\n',
                      'HTTP OpenAPI。core `LiteratureRelationsArtifactContent`/`ReasoningTracesArtifactContent`\n仅表达当前读取投影，不是编写源，也不能进入 Publisher。\n',
                  ),
                  (
                      '手工重建、单条 Relation/Trace、raw extraction、\ntask-read 投影均不恢复 seal。修改 Relation、Evidence、Trace、confidence、版本、\n',
                      '手工重建、单条 Relation/Trace、raw extraction 与读取投影均不恢复 seal。\n修改 Relation、Evidence、Trace、confidence、版本、\n',
                  ),
              ],
          )
          rewrite(
              'packages/schemas/README.md',
              [
                  (
                      '- `generated/literature_claim` 固定唯一领域编写源的 extraction、admission、publisher candidate 与 Benchmark report；task-read `reasoning.LiteratureClaim`/`LiteratureReasoningResponse` 和 core `LiteratureClaimsArtifactContent` 是当前读取投影，不能进入 Publisher。\n',
                      '- `generated/literature_claim` 固定唯一领域编写源的 extraction、admission、publisher candidate 与 Benchmark report；core `LiteratureClaimsArtifactContent` 仅为读取投影，不能进入 Publisher。\n',
                  ),
                  (
                      '- `generated/literature_relation` 固定唯一领域编写源的 extraction、Relation/ReasoningTrace admission、publisher candidate 与 Benchmark report；task-read `reasoning.LiteratureRelation`/`ReasoningTrace` 和 core `LiteratureRelationsArtifactContent`/`ReasoningTracesArtifactContent` 是当前读取投影，不能进入 Publisher。\n',
                      '- `generated/literature_relation` 固定唯一领域编写源的 extraction、Relation/ReasoningTrace admission、publisher candidate 与 Benchmark report；core `LiteratureRelationsArtifactContent`/`ReasoningTracesArtifactContent` 仅为读取投影，不能进入 Publisher。\n',
                  ),
                  (
                      '- `generated/graph` 固定 Versioned Evidence Graph 的唯一领域编写源和 Benchmark contract；它不是 HTTP DTO。Graph-owned Evidence-use、完整上游版本闭包与 Publisher handoff 必须由 typed candidate 表达，task-read `GraphResponse` 或页面 Domain model 不能进入 Publisher。\n',
                      '- `generated/graph` 固定 Evidence Graph 的唯一领域编写源和 Benchmark contract；它不是 HTTP DTO。Graph-owned Evidence-use、完整上游版本闭包与 Publisher handoff 必须由 typed candidate 表达，页面 Domain model 不能进入 Publisher。\n',
                  ),
              ],
          )

          # Convert benchmark tests from review-history semantics to one current scientific review.
          path = Path('apps/api/tests/test_paper_benchmark.py')
          text = path.read_text(encoding='utf-8')

          old_signature = '''    verdict: str = "pass",\n    sequence: int = 1,\n    supersedes: str | None = None,\n    reviewer_type: str = "web_gpt",\n'''
          new_signature = '''    verdict: str = "pass",\n    reviewer_type: str = "web_gpt",\n'''
          if old_signature not in text:
              raise SystemExit('benchmark review helper signature drifted')
          text = text.replace(old_signature, new_signature, 1)

          old_fields = '''        "review_id": review_id,\n        "review_sequence": sequence,\n        "supersedes_review_id": supersedes,\n        "reviewed_at": "2026-07-21T12:00:00+08:00",\n'''
          new_fields = '''        "review_id": review_id,\n        "reviewed_at": "2026-07-21T12:00:00+08:00",\n'''
          if old_fields not in text:
              raise SystemExit('benchmark review helper fields drifted')
          text = text.replace(old_fields, new_fields, 1)

          audit_start = text.index('@pytest.mark.parametrize(\n    "field",\n    ["created_at", "review_records", "change_records"],\n)\ndef test_audit_and_review_metadata_are_hash_bound')
          audit_end = text.index('\ndef test_wrong_content_hash_is_rejected()', audit_start)
          audit_replacement = '''@pytest.mark.parametrize("field", ["created_at", "review_records"])\ndef test_current_audit_and_review_metadata_are_hash_bound(field: str) -> None:\n    payload = _read_payload()\n    if field == "created_at":\n        payload[field] = "2026-07-20"\n    else:\n        payload["review_records"][0]["notes"] += " changed"\n\n    assert compute_benchmark_content_hash(payload) != _read_payload()["content_hash"]\n\n\n'''
          text = text[:audit_start] + audit_replacement + text[audit_end + 1:]

          evolution_start = text.index('@pytest.mark.parametrize(\n    ("records", "expected_message"),')
          evolution_end = text.index('\ndef test_scientific_hash_excludes_review_metadata_but_detects_payload_tampering()', evolution_start)
          text = text[:evolution_start] + text[evolution_end + 1:]

          blocked_start = text.index('def test_unresolved_scientific_block_prevents_approval() -> None:\n')
          blocked_end = text.index('\ndef test_unsupported_reviewer_type_is_rejected()', blocked_start)
          blocked_replacement = '''def test_current_blocked_scientific_review_prevents_approval() -> None:\n    payload = _approved_payload("benchmark_scientific_review")\n    passed = payload["review_records"][0]\n    payload["review_records"] = [\n        _review_record(\n            {**payload, "content_hash": payload["scientific_payload_hash"]},\n            review_id="review.scientific_blocked",\n            purpose="benchmark_scientific_review",\n            verdict="blocked",\n            reviewed_content_hash=payload["scientific_payload_hash"],\n            scope=passed["scope"],\n        )\n    ]\n\n    with pytest.raises(ValidationError, match="BLOCKED scientific review"):\n        BenchmarkPackagePayload.model_validate(payload)\n\n\ndef test_final_package_requires_exactly_one_current_scientific_review() -> None:\n    payload = _read_payload()\n    payload["review_status"] = "pending_scientific_review"\n    payload["review_records"] = []\n    payload["scientific_payload_hash"] = compute_benchmark_scientific_payload_hash(payload)\n    payload["content_hash"] = compute_benchmark_content_hash(payload)\n\n    with pytest.raises(ValidationError, match="exactly one current scientific review"):\n        BenchmarkPackage.model_validate(payload)\n\n\n'''
          text = text[:blocked_start] + blocked_replacement + text[blocked_end + 1:]

          for forbidden in ('review_sequence', 'supersedes_review_id', 'change_records', 'sequence=', 'supersedes='):
              if forbidden in text:
                  raise SystemExit(f'benchmark history token remains in test file: {forbidden}')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          # Rebuild generated schema families from current authoring sources before semantic gates run.
          export_schema() {
            PYTHONPATH="$PWD/apps/api/src" uv run --project apps/api python scripts/export_schemas.py "$@"
          }
          export_schema --output packages/schemas/generated/data_pipeline \
            --include DataSourceCompletion --include CrossmatchInput --include CrossmatchResult \
            --include CrossmatchBenchmarkManifest --include CrossmatchBenchmarkReport \
            --include DataArtifactBuildInput --include DatasetArtifactCandidate \
            --include FieldDictionaryArtifactCandidate --include SourceCollectionArtifactCandidate \
            --include MappingRuleSet --include UnitConversionCatalog --include DataQualityRuleSet \
            --include QualityEvaluationPlan --include QualityMetricPlan \
            --include DataQualityEvaluationInput --include DataQualityEvaluationResult \
            --include DataQualityEvaluationRejected --include FieldQualityResult \
            --include RowQualityResult --include DatasetQualityResult \
            --include ResearchContractQualityGate --include QualityConstraintResult \
            --include QualityMetricResult
          export_schema --output packages/schemas/generated/literature_claim \
            --include LiteratureClaimExtractionOutput --include LiteratureClaimCandidate \
            --include LiteratureClaimAdmissionResult --include LiteratureClaimsCandidate \
            --include LiteratureClaimBenchmarkEvaluationCase --include LiteratureClaimBenchmarkReport
          export_schema --output packages/schemas/generated/literature_relation \
            --include LiteratureRelationExtractionOutput --include LiteratureRelationCandidate \
            --include LiteratureRelationAdmissionResult --include LiteratureRelationsCandidate \
            --include LiteratureReasoningTraceCandidate \
            --include LiteratureRelationBenchmarkEvaluationCase --include LiteratureRelationBenchmarkReport
          export_schema --output packages/schemas/generated/graph --manifest-content-hashes \
            --include GraphBuildRequest --include GraphArtifactNode --include GraphArtifactEdge \
            --include GraphEvidenceUse --include GraphIntegrityReport --include GraphArtifactCandidate \
            --include GraphAdmissionResult --include GraphBenchmarkEvaluationCase --include GraphBenchmarkReport
          export_schema --output packages/schemas/generated/core \
            --include ResearchProject --include ResearchContractDraft --include ResearchContract \
            --include ResearchRun --include RunEvent --include ResearchArtifact --include ArtifactVersion \
            --include ResearchArtifactDetail --include ArtifactVersionDetail \
            --include PaperSummaryArtifactContent --include PaperSummaryRead \
            --include PaperCollectionRead --include PaperCollectionCandidateRead \
            --include DataArtifactReadBase --include DatasetArtifactRead \
            --include FieldDictionaryArtifactRead --include SourceCollectionArtifactRead \
            --include DataArtifactRowRead --include LiteratureClaimRead --include LiteratureRelationRead \
            --include LiteratureReasoningTraceRead --include CreateArtifactExportRequest \
            --include ArtifactExportRead --include EvidenceRead --include SourceSnapshotDetail \
            --include SessionCreated --include WorkspaceSnapshot --include ShareSnapshot \
            --include ShareSnapshotCreated --include PublicShareSnapshot --include ResearchInputRef \
            --include ResearchInputDetail --include CreateResearchInputRequest \
            --include CreateResearchInputMultipartRequest --include BindResearchInputRequest
          PYTHONPATH="$PWD/apps/api/src" uv run --project apps/api python scripts/export_openapi.py \
            --output packages/schemas/generated/core/openapi.json
          export_schema --output packages/schemas/generated/scientific_document \
            --include DocumentBBox --include TextSpan --include DocumentLocator --include DocumentPage \
            --include DocumentBlock --include DocumentTableCell --include DocumentTable \
            --include DocumentFormula --include DocumentFigure --include DocumentParseProfile \
            --include DocumentParseInput --include DocumentParseCandidate \
            --include ScientificDataExtractionCandidate --include GoldenSetEntry \
            --include GoldenExpectedAnnotation --include GoldenSetManifest \
            --include BenchmarkMetricValue --include BenchmarkCaseResult --include BenchmarkReport
          export_schema --output packages/schemas/generated/security \
            --include ResearchSession --include SessionCreated --include SessionQuota --include ProblemDetails
          node scripts/sync_contracts.mjs

          bash /tmp/pr209-materialize.sh
          bash /tmp/pr209-commit.sh
