name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository foundation
        run: |
          python -m unittest scripts.test_check_foundation
          python scripts/check_foundation.py

      - name: Check versionless API naming
        run: node scripts/check-versionless-api.mjs

      - name: Validate Docker Compose contract
        run: |
          cp .env.example .env
          docker compose config --quiet

  backend:
    name: Backend tests and schema export
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xingwen_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xingwen_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xingwen_test_db
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Upgrade isolated PostgreSQL schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: uv run pytest

      - name: Run reproducible D07 claim benchmark
        working-directory: .
        run: >
          uv run --project apps/api python -m services.paper_pipeline.claim_benchmark
          --output .artifacts/d07-claim-benchmark-report.json

      - name: Run reproducible D08 relation benchmark
        working-directory: .
        run: >
          uv run --project apps/api python -m services.paper_pipeline.relation_benchmark
          --cases-output .artifacts/d08-relation-benchmark-cases.json
          --output .artifacts/d08-relation-benchmark-report.json

      - name: Check phase0 pipeline schema contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/phase0
          --include DatasetResponse
          --include ColumnInfo
          --include QualityScore
          --include SourceRecordItem
          --include PaperSearchQuery
          --include PaperAcquisitionRun
          --include PaperCandidate
          --include PaperSummary
          --include LiteratureClaim
          --include LiteratureRelation
          --include ReasoningTrace
          --include EvidenceResponse
          --include SourceSnapshot
          --include DataSourceCompletion
          --include CrossmatchInput
          --include CrossmatchResult
          --include CrossmatchBenchmarkManifest
          --include CrossmatchBenchmarkReport
          --include DataArtifactBuildInput
          --include DatasetArtifactCandidate
          --include FieldDictionaryArtifactCandidate
          --include SourceCollectionArtifactCandidate
          --include MappingRuleSet
          --include UnitConversionCatalog
          --include DataQualityRuleSet
          --include QualityEvaluationPlan
          --include QualityMetricPlan
          --include DataQualityEvaluationInput
          --include DataQualityEvaluationResult
          --include DataQualityEvaluationRejected
          --include FieldQualityResult
          --include RowQualityResult
          --include DatasetQualityResult
          --include ResearchContractQualityGate
          --include QualityConstraintResult
          --include QualityMetricResult
          --check

      - name: Check D07 LiteratureClaim pipeline contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/literature_claim
          --include LiteratureClaimExtractionOutput
          --include LiteratureClaimCandidate
          --include LiteratureClaimAdmissionResult
          --include LiteratureClaimsCandidate
          --include LiteratureClaimBenchmarkEvaluationCase
          --include LiteratureClaimBenchmarkReport
          --check

      - name: Check D08 LiteratureRelation pipeline contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/literature_relation
          --include LiteratureRelationExtractionOutput
          --include LiteratureRelationCandidate
          --include LiteratureRelationAdmissionResult
          --include LiteratureRelationsCandidate
          --include LiteratureReasoningTraceCandidate
          --include LiteratureRelationBenchmarkEvaluationCase
          --include LiteratureRelationBenchmarkReport
          --check

      - name: Check core contracts
        run: |
          uv run python ../../scripts/export_schemas.py \
            --output ../../packages/schemas/generated/core \
            --include ResearchProject \
            --include ResearchContractDraft \
            --include ResearchContract \
            --include ResearchRun \
            --include RunEvent \
            --include ResearchArtifact \
            --include ArtifactVersion \
            --include ResearchArtifactDetail \
            --include ArtifactVersionDetail \
            --include PaperSummaryArtifactContent \
            --include PaperSummaryRead \
            --include PaperCollectionRead \
            --include PaperCollectionCandidateRead \
            --include DataArtifactReadBase \
            --include DatasetArtifactRead \
            --include FieldDictionaryArtifactRead \
            --include SourceCollectionArtifactRead \
            --include DataArtifactRowRead \
            --include CreateArtifactExportRequest \
            --include ArtifactExportRead \
            --include EvidenceRead \
            --include SourceSnapshotDetail \
            --include SessionCreated \
            --include WorkspaceSnapshot \
            --include ShareSnapshot \
            --include ShareSnapshotCreated \
            --include PublicShareSnapshot \
            --include ResearchInputRef \
            --include ResearchInputDetail \
            --include CreateResearchInputRequest \
            --include BindResearchInputRequest \
            --check
          uv run python ../../scripts/export_openapi.py \
            --output ../../packages/schemas/generated/core/openapi.json \
            --check

      - name: Check session security contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/security
          --include ResearchSession
          --include SessionCreated
          --include SessionQuota
          --include ProblemDetails
          --check

  frontend:
    name: Frontend quality and entrypoint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated transport contracts
        run: |
          pnpm --filter @xingwen/contracts sync-contracts
          git diff --exit-code -- packages/contracts/src/generated

      - name: Check formatting
        run: pnpm format:check

      - name: Check documentation governance
        run: pnpm check:docs

      - name: Lint frontend workspace
        run: pnpm lint

      - name: Typecheck apps and shared packages
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build site and workspace
        run: pnpm build

      - name: Check package architecture
        run: pnpm check:architecture

      - name: Check retired runtime removal
        run: pnpm check:legacy

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend entrypoint smoke
        run: pnpm test:e2e

  x01-integration:
    name: X-01 real Compose and browser integration
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: x01-ci-${{ github.run_id }}
      X01_API_ORIGIN: http://localhost:8000
      X01_WORKSPACE_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install locked dependencies and browser runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start isolated fresh Compose project
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.integration.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.integration.yml up --build --detach --wait --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.integration.yml ps --all
          migrate_id="$(docker compose -f docker-compose.yml -f docker-compose.integration.yml ps --all -q migrate)"
          test -n "$migrate_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migrate_id")" = "0"
          curl --fail --silent --show-error http://localhost:8000/api/health

      - name: Run real HTTP Browser and Fixture parity integration
        run: pnpm test:e2e:integration

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml logs --no-color

      - name: Remove only the isolated CI Compose project and volume
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down --volumes --remove-orphans
