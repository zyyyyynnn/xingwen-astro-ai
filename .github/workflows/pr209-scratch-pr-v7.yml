name: Isolated clean-tree materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-clean-tree:
    if: github.event.pull_request.head.ref == 'codex/pr209-final-repair-scratch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr209-final-repair-scratch
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.8'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync backend dependencies
        run: uv sync --project apps/api --frozen

      - name: Apply already-proven deterministic transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr209-scratch-pr-v6.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          python scripts/pr209_scratch_repair.py"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_program = textwrap.dedent(workflow[start:end])
          exec(compile(patch_program, '<v6-transform-patch>', 'exec'))
          PY

          python scripts/pr209_scratch_repair.py
          rm -f .github/workflows/pr209-scratch-pr*.yml
          git diff --check

      - name: Fast import and compile smoke
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          import app.main
          from app.services.research import ResearchApplicationService
          from app.routers import research
          from app.schemas import core
          print('research import boundary: OK')
          PY
          uv run python -m compileall -q src tests

      - name: Commit clean candidate tree
        shell: bash
        run: |
          test ! -e scripts/pr209_scratch_repair.py
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'pr209-scratch-*' -print -quit)"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor(repo): materialize final current architecture'
          git push origin HEAD:codex/pr209-final-repair-scratch
