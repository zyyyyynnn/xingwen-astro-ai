name: D-01 approval closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  close-d01:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/d01-approval-closure
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync backend dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Record D-01 approval evidence
        working-directory: apps/api
        run: uv run python ../../.github/scripts/close_d01_approval.py

      - name: Adapt pending-only test fixtures
        run: python .github/scripts/fix_d01_closure_tests.py

      - name: Run benchmark tests
        id: benchmark
        continue-on-error: true
        working-directory: apps/api
        run: uv run pytest tests/test_paper_benchmark.py -q --tb=short > ../../d01-test.log 2>&1

      - name: Upload benchmark test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d01-test-log
          path: d01-test.log

      - name: Stop on benchmark failure
        if: steps.benchmark.outcome == 'failure'
        run: exit 1

      - name: Validate backend and schemas
        working-directory: apps/api
        run: |
          uv run pytest
          uv run python ../../scripts/export_schemas.py --output ../../.artifacts/schemas
          uv run python ../../scripts/export_schemas.py --output ../../.artifacts/schemas --check

      - name: Validate repository foundation
        run: |
          python scripts/check_foundation.py
          git diff --check

      - name: Remove one-shot automation
        run: |
          rm .github/workflows/d01-approval-closure.yml
          rm .github/scripts/close_d01_approval.py
          rm .github/scripts/fix_d01_closure_tests.py

      - name: Commit generated closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record D-01 approval evidence"
          git push origin HEAD:chore/d01-approval-closure
