name: One-time de-legacy source edit

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  edit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/governance-authority-current-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main
          fetch-depth: 0

      - name: Apply structural cleanup
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          ROOT = Path('.')
          RETIRED_MODULES = {'app.schemas.reasoning', 'app.schemas.graph'}


          class RetiredVariableFilter(ast.NodeTransformer):
              def __init__(self, names: set[str]) -> None:
                  self.names = names

              def _filter(self, values: list[ast.expr]) -> list[ast.expr]:
                  return [
                      value
                      for value in values
                      if not (isinstance(value, ast.Name) and value.id in self.names)
                  ]

              def visit_Tuple(self, node: ast.Tuple) -> ast.AST:
                  self.generic_visit(node)
                  node.elts = self._filter(node.elts)
                  return node

              def visit_List(self, node: ast.List) -> ast.AST:
                  self.generic_visit(node)
                  node.elts = self._filter(node.elts)
                  return node

              def visit_Set(self, node: ast.Set) -> ast.AST:
                  self.generic_visit(node)
                  node.elts = self._filter(node.elts)
                  return node


          def transform_projection_test(path: Path) -> None:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)
              retired_aliases: set[str] = set()
              import_ranges: list[tuple[int, int]] = []
              for node in tree.body:
                  if isinstance(node, ast.ImportFrom) and node.module in RETIRED_MODULES:
                      import_ranges.append((node.lineno, node.end_lineno or node.lineno))
                      for alias in node.names:
                          retired_aliases.add(alias.asname or alias.name)
              if not retired_aliases:
                  return

              replacements: list[tuple[int, int, str]] = []
              handled_aliases: set[str] = set()
              for node in tree.body:
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  segment = ast.get_source_segment(source, node) or ''
                  used = {name for name in retired_aliases if re.search(rf'\b{re.escape(name)}\b', segment)}
                  if not used:
                      continue
                  if not any(token in node.name for token in ('read', 'projection', 'bypass', 'shape')):
                      raise RuntimeError(
                          f'{path}:{node.lineno}: retired projection alias appears in non-baseline test {node.name}'
                      )
                  retired_variables: set[str] = set()
                  for statement in node.body:
                      statement_text = ast.get_source_segment(source, statement) or ''
                      if not any(re.search(rf'\b{re.escape(name)}\b', statement_text) for name in used):
                          continue
                      if isinstance(statement, ast.Assign):
                          for target in statement.targets:
                              if isinstance(target, ast.Name):
                                  retired_variables.add(target.id)
                      elif isinstance(statement, ast.AnnAssign) and isinstance(statement.target, ast.Name):
                          retired_variables.add(statement.target.id)

                  body: list[ast.stmt] = []
                  for statement in node.body:
                      statement_text = ast.get_source_segment(source, statement) or ''
                      if any(re.search(rf'\b{re.escape(name)}\b', statement_text) for name in used):
                          continue
                      filtered = RetiredVariableFilter(retired_variables).visit(statement)
                      body.append(filtered)

                  replacement = ast.FunctionDef(
                      name=node.name
                          .replace('read_and_candidate_shapes', 'non_authoritative_candidate_shapes')
                          .replace('read_and_candidate_shape', 'non_authoritative_candidate_shape'),
                      args=node.args,
                      body=body,
                      decorator_list=node.decorator_list,
                      returns=node.returns,
                      type_comment=node.type_comment,
                  )
                  ast.fix_missing_locations(replacement)
                  replacements.append(
                      (node.lineno, node.end_lineno or node.lineno, ast.unparse(replacement) + '\n')
                  )
                  handled_aliases.update(used)

              if handled_aliases != retired_aliases:
                  missing = sorted(retired_aliases - handled_aliases)
                  raise RuntimeError(f'{path}: unhandled retired projection aliases: {missing}')
              replacements.extend((start, end, '') for start, end in import_ranges)
              for start, end, replacement in sorted(replacements, reverse=True):
                  lines[start - 1:end] = [replacement]
              updated = ''.join(lines)
              ast.parse(updated)
              for alias in retired_aliases:
                  if re.search(rf'\b{re.escape(alias)}\b', updated):
                      raise RuntimeError(f'{path}: retired alias remains after transformation: {alias}')
              path.write_text(updated, encoding='utf-8')


          for test_path in (
              ROOT / 'apps/api/tests/test_literature_claim_pipeline.py',
              ROOT / 'apps/api/tests/test_literature_relation_pipeline.py',
          ):
              if test_path.exists():
                  transform_projection_test(test_path)

          # Markdown role is structural. Remove lifecycle metadata everywhere;
          # references are non-normative and therefore do not declare Authority.
          for path in ROOT.rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              filtered: list[str] = []
              for line in lines:
                  if re.match(r'^\|\s*(?:Status|Issue|Superseded by|Time range)\s*\|', line, re.I):
                      continue
                  if 'docs/references' in path.as_posix() and re.match(r'^\|\s*Authority\s*\|', line, re.I):
                      continue
                  filtered.append(line)
              updated = ''.join(filtered)
              updated = updated.replace('VERSIONED_DATA_ARTIFACTS.md', 'DATA_ARTIFACTS.md')
              updated = updated.replace('Versioned Data Artifacts', 'Data Artifacts')
              updated = updated.replace('Versioned Evidence Graph Pipeline', 'Evidence Graph Pipeline')
              updated = updated.replace('Versioned Evidence Graph', 'Evidence Graph')
              path.write_text(updated, encoding='utf-8')

          # Delete historical copies and machine changelogs. Git owns history.
          for relative in (
              'packages/prompts/literature_reasoning/v1.md',
              'packages/prompts/paper_summary/v1.md',
              'services/data_pipeline/fixtures/exoplanet_host_star/nasa-toi-first-page.recorded.v1.json',
              'services/data_pipeline/manifests/exoplanet_host_star/quality-rules/quality-rules.v1.json',
              'services/data_pipeline/manifests/CHANGELOG.md',
              'services/paper_pipeline/benchmarks/CHANGELOG.md',
          ):
              path = ROOT / relative
              if path.exists():
                  path.unlink()

          # Old transport projection modules may be deleted only after the test
          # transformation leaves no active import of them.
          active_python = [
              path
              for base in (ROOT / 'apps/api/src', ROOT / 'apps/api/tests')
              for path in base.rglob('*.py')
              if path.as_posix() not in {
                  'apps/api/src/app/schemas/graph.py',
                  'apps/api/src/app/schemas/reasoning.py',
              }
          ]
          for module in RETIRED_MODULES:
              hits = [
                  path
                  for path in active_python
                  if module in path.read_text(encoding='utf-8')
              ]
              if hits:
                  raise RuntimeError(f'{module} still imported by: {hits}')
          for relative in (
              'apps/api/src/app/schemas/graph.py',
              'apps/api/src/app/schemas/reasoning.py',
          ):
              path = ROOT / relative
              if path.exists():
                  path.unlink()
          PY

          python -m compileall -q apps/api/src apps/api/tests
          git diff --check

      - name: Commit exact cleanup and remove maintenance workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-delegacy-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(repo): remove residual historical projections"
          git push origin HEAD:codex/governance-authority-current-main
