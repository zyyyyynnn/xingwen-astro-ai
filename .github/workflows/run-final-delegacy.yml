name: Run final de-legacy closure

on:
  push:
    branches:
      - codex/governance-authority-current-main

permissions:
  contents: write

concurrency:
  group: pr209-final-delegacy
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Apply current-tree migration
        run: python scripts/finalize_delegacy_once.py

      - name: Validate transformed architecture
        shell: bash
        run: |
          uv sync --project apps/api --frozen
          python -m compileall -q apps/api/src apps/api/tests scripts/export_schemas.py
          PYTHONPATH=apps/api/src uv run --project apps/api python - <<'PY'
          from services.paper_pipeline.benchmark import load_frozen_benchmark
          package = load_frozen_benchmark()
          assert len(package.review_records) == 1
          review = package.review_records[0]
          assert review.reviewed_benchmark_version == package.benchmark_version
          assert review.reviewed_content_hash == package.scientific_payload_hash
          PY
          uv run --project apps/api pytest \
            apps/api/tests/test_paper_benchmark.py \
            apps/api/tests/test_paper_collection_pipeline.py \
            apps/api/tests/test_literature_claim_pipeline.py \
            apps/api/tests/test_literature_relation_pipeline.py \
            apps/api/tests/test_graph_pipeline.py \
            apps/api/tests/test_graph_publisher_port.py \
            apps/api/tests/test_artifact_publisher.py \
            -q
          uv run --project apps/api python scripts/export_schemas.py \
            --family data_pipeline \
            --output packages/schemas/generated/data_pipeline \
            --check

          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            scripts/check-docs-rules.mjs \
            scripts/check-docs.mjs \
            scripts/check-docs.test.mjs \
            scripts/governance-identifiers.mjs \
            scripts/check-architecture-delegacy.mjs \
            scripts/check-architecture-delegacy.test.mjs \
            package.json \
            apps/site/package.json \
            apps/workspace/package.json \
            packages/design-tokens/package.json \
            packages/ui/package.json \
            packages/domain/package.json \
            packages/contracts/package.json \
            packages/data-access/package.json \
            packages/workspace-core/package.json \
            packages/testing/package.json \
            .github/workflows/ci.yml
          node --test scripts/check-docs.test.mjs scripts/check-architecture-delegacy.test.mjs
          node scripts/check-docs.mjs
          node scripts/check-architecture-delegacy.mjs
          git diff --check

      - name: Remove one-time maintenance machinery
        shell: bash
        run: |
          rm -f scripts/finalize_delegacy_once.py
          rm -f .github/workflows/run-final-delegacy.yml
          rm -f .github/workflows/final-delegacy-maintenance.yml
          rm -f .github/workflows/benchmark-current-maintenance.yml
          rm -f .github/workflows/repository-maintenance.yml
          rm -f .github/workflows/one-time-delegacy-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(repo): finalize current architecture closure"
          git push origin HEAD:codex/governance-authority-current-main
