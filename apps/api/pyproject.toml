[project]
name = "api"
version = "0.1.0"
description = "星文智析 — AI-powered astronomical research tool backend"
authors = [
    { name = "xingwen-team" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.16.1,<2",
    "fastapi>=0.139.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.9,<4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.28.1",
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
pythonpath = ["../.."]
markers = [
    "live: opt-in tests that call a real external source",
]
