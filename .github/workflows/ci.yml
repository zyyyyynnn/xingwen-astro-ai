name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate repository foundation
        run: python scripts/check_foundation.py

      - name: Check versionless API naming
        run: node scripts/check-versionless-api.mjs

      - name: Check PR and commit title grammar
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-title-governance.mjs

      - name: Lint issue templates for live-state mirrors
        env:
          TEMPLATE_DIR: .github/ISSUE_TEMPLATE
        run: |
          node scripts/check-title-governance.mjs

      - name: Check integration commit title grammar
        if: github.event_name == 'push'
        env:
          INTEGRATION_SHA: ${{ github.sha }}
        run: node scripts/check-title-governance.mjs

      - name: Validate Docker Compose contract
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check scientific document parsing governance gate
        run: python scripts/check_scientific_document_governance.py

  backend:
    name: Backend tests and schema export
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xingwen_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xingwen_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xingwen_test_db
      PYTHONPATH: ${{ github.workspace }}/apps/api/src:${{ github.workspace }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Smoke current Research import boundary
        run: |
          uv run python - <<'PY'
          import app.main
          from app.services.research import ResearchApplicationService
          from app.routers import research
          from app.schemas import core
          print("research import boundary: OK")
          PY
          uv run python -m compileall -q src tests

      - name: Bootstrap isolated PostgreSQL schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run python -m app.db.schema

      - name: Run backend tests
        run: uv run pytest -m "not scientific_document_native"

      - name: Run reproducible LiteratureClaim benchmark
        working-directory: .
        run: >
          uv run --project apps/api python -m services.paper_pipeline.claim_benchmark
          --output .artifacts/literature-claim-benchmark-report.json

      - name: Run reproducible LiteratureRelation benchmark
        working-directory: .
        run: >
          uv run --project apps/api python -m services.paper_pipeline.relation_benchmark
          --cases-output .artifacts/literature-relation-benchmark-cases.json
          --output .artifacts/literature-relation-benchmark-report.json

      - name: Run reproducible Evidence Graph benchmark
        working-directory: .
        run: >
          uv run --project apps/api python -m services.graph_pipeline.benchmark
          --cases-output .artifacts/evidence-graph-benchmark-cases.json
          --output .artifacts/evidence-graph-benchmark-report.json

      - name: Check data pipeline schema contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/data_pipeline
          --include DataSourceCompletion
          --include CrossmatchInput
          --include CrossmatchResult
          --include CrossmatchBenchmarkManifest
          --include CrossmatchBenchmarkReport
          --include DataArtifactBuildInput
          --include DatasetArtifactCandidate
          --include FieldDictionaryArtifactCandidate
          --include SourceCollectionArtifactCandidate
          --include MappingRuleSet
          --include UnitConversionCatalog
          --include DataQualityRuleSet
          --include QualityEvaluationPlan
          --include QualityMetricPlan
          --include DataQualityEvaluationInput
          --include DataQualityEvaluationResult
          --include DataQualityEvaluationRejected
          --include FieldQualityResult
          --include RowQualityResult
          --include DatasetQualityResult
          --include ResearchContractQualityGate
          --include QualityConstraintResult
          --include QualityMetricResult
          --check

      - name: Check LiteratureClaim pipeline contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/literature_claim
          --include LiteratureClaimExtractionOutput
          --include LiteratureClaimCandidate
          --include LiteratureClaimAdmissionResult
          --include LiteratureClaimsCandidate
          --include LiteratureClaimBenchmarkEvaluationCase
          --include LiteratureClaimBenchmarkReport
          --check

      - name: Check LiteratureRelation pipeline contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/literature_relation
          --include LiteratureRelationExtractionOutput
          --include LiteratureRelationCandidate
          --include LiteratureRelationAdmissionResult
          --include LiteratureRelationsCandidate
          --include LiteratureReasoningTraceCandidate
          --include LiteratureRelationBenchmarkEvaluationCase
          --include LiteratureRelationBenchmarkReport
          --check

      - name: Check Evidence Graph pipeline contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/graph
          --include GraphBuildRequest
          --include GraphArtifactNode
          --include GraphArtifactEdge
          --include GraphEvidenceUse
          --include GraphIntegrityReport
          --include GraphArtifactCandidate
          --include GraphAdmissionResult
          --include GraphBenchmarkEvaluationCase
          --include GraphBenchmarkReport
          --manifest-content-hashes
          --check

      - name: Check core contracts
        run: |
          uv run python ../../scripts/export_core_schemas.py --check
          uv run python ../../scripts/export_openapi.py \
            --output ../../packages/schemas/generated/core/openapi.json \
            --check

      - name: Check scientific document parsing benchmark contracts
        run: >-
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/scientific_document
          --include DocumentBBox
          --include TextSpan
          --include DocumentLocator
          --include DocumentPage
          --include DocumentBlock
          --include DocumentTableCell
          --include DocumentTable
          --include DocumentFormula
          --include DocumentFigure
          --include DocumentParseProfile
          --include DocumentParseInput
          --include DocumentParseCandidate
          --include ScientificDataExtractionCandidate
          --include GoldenSetEntry
          --include GoldenExpectedAnnotation
          --include GoldenSetManifest
          --include BenchmarkMetricValue
          --include BenchmarkCaseResult
          --include BenchmarkReport
          --check

      - name: Run scientific document native baseline benchmark (benchmark dependency group)
        working-directory: .
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/apps/api/.venv
          PYTHONPATH: ${{ github.workspace }}/apps/api/src
        run: >-
          uv sync --frozen --project apps/api --group benchmark
          && uv run --project apps/api pytest apps/api/tests/test_scientific_document_*.py -m scientific_document_native -q
          && uv run --project apps/api python -m services.scientific_document.benchmark_runner
          --output .artifacts/scientific_document-native-benchmark-report.json
          && uv run --project apps/api python scripts/check_scientific_document_benchmark_report.py .artifacts/scientific_document-native-benchmark-report.json

      - name: Check session security contracts
        run: >
          uv run python ../../scripts/export_schemas.py
          --output ../../packages/schemas/generated/security
          --include ResearchSession
          --include SessionCreated
          --include SessionQuota
          --include ProblemDetails
          --check

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated transport contracts
        run: |
          pnpm --filter @xingwen/contracts sync-contracts
          git diff --exit-code -- packages/contracts/src/generated

      - name: Check formatting
        run: pnpm format:check

      - name: Check documentation governance
        run: pnpm check:docs

      - name: Lint frontend workspace
        run: pnpm lint

      - name: Typecheck apps and shared packages
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build site and workspace
        run: pnpm build

      - name: Check package architecture
        run: pnpm check:architecture

  real-integration:
    name: Real Compose and browser integration
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: real-integration-ci-${{ github.run_id }}
      REAL_INTEGRATION_API_ORIGIN: http://localhost:8000
      REAL_INTEGRATION_WORKSPACE_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime (single owner for all browser tests)
        run: pnpm exec playwright install chromium

      - name: Run frontend entrypoint smoke
        run: pnpm test:e2e

      - name: Start isolated fresh Compose project
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.integration.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.integration.yml up --build --detach --wait --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.integration.yml ps --all
          schema_id="$(docker compose -f docker-compose.yml -f docker-compose.integration.yml ps --all -q schema)"
          test -n "$schema_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$schema_id")" = "0"
          curl --fail --silent --show-error http://localhost:8000/api/health

      - name: Run real HTTP Browser and Fixture parity integration
        run: pnpm test:e2e:integration

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml logs --no-color

      - name: Remove only the isolated CI Compose project and volume
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down --volumes --remove-orphans
