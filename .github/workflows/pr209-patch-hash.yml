name: PR209 patch transport check

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr209-patch-hash.yml]

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.head.ref == 'codex/governance-authority-current-main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main
      - name: Hash staged patch parts
        run: |
          wc -c scripts/.pr209-final-patch-1 scripts/.pr209-final-patch-2 scripts/.pr209-final-patch-3
          sha256sum scripts/.pr209-final-patch-1 scripts/.pr209-final-patch-2 scripts/.pr209-final-patch-3
          cat scripts/.pr209-final-patch-1 scripts/.pr209-final-patch-2 scripts/.pr209-final-patch-3 | sha256sum
