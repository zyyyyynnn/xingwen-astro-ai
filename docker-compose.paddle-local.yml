# Optional production-equivalent local PaddleOCR-VL runtime.
# The verified model bundle remains an operator-managed asset under ./models and
# is mounted read-only; model weights are never copied into the image or Git.

services:
  api:
    build:
      target: api-visual
    environment:
      PADDLEOCR_VL_BASE_URL: ""
      PADDLEOCR_VL_MODEL_REVISION: ""
      PADDLEOCR_VL_LOCAL_BUNDLE: /models
    volumes:
      - ./models:/models:ro
