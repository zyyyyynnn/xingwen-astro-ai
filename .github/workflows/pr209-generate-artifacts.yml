name: PR209 closure patch inspection

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr209-generate-artifacts.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main

      - name: Decode staged patch without modifying the repository
        run: |
          cat scripts/.pr209-final-patch-1 scripts/.pr209-final-patch-2 scripts/.pr209-final-patch-3 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/pr209-final.patch
          git apply --check /tmp/pr209-final.patch
          git apply --stat /tmp/pr209-final.patch

      - name: Upload decoded patch
        uses: actions/upload-artifact@v4
        with:
          name: pr209-decoded-patch
          if-no-files-found: error
          path: /tmp/pr209-final.patch
