name: Final de-legacy maintenance

on:
  push:
    branches:
      - codex/governance-authority-current-main
    paths:
      - .github/workflows/final-delegacy-maintenance.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Restore task-handoff sources for deterministic transformation
        shell: bash
        run: |
          git checkout 45a417fa9ce60795bde007c6cd48a718cee23285 -- \
            apps/api/src/app/schemas/paper_benchmark.py \
            apps/api/tests/test_paper_benchmark.py \
            apps/api/tests/test_literature_claim_pipeline.py \
            apps/api/tests/test_literature_relation_pipeline.py \
            services/paper_pipeline/benchmarks/exoplanet_host_star/paper-reasoning-benchmark.json
          git fetch origin main
          git checkout origin/main -- apps/workspace/upstream

      - name: Apply validated structural transforms
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          HISTORY_TOKENS = {
              'review_sequence',
              'supersedes_review_id',
              'BenchmarkChangeRecord',
              'change_records',
              '_effective_review_records',
          }
          RETIRED_MODULES = {'app.schemas.reasoning', 'app.schemas.graph'}


          def source_has(node: ast.AST, source: str, tokens: set[str]) -> bool:
              segment = ast.get_source_segment(source, node) or ''
              return any(token in segment for token in tokens)


          class HistoryPruner(ast.NodeTransformer):
              def __init__(self, source: str) -> None:
                  self.source = source

              def visit_ClassDef(self, node: ast.ClassDef):
                  if node.name == 'BenchmarkChangeRecord':
                      return None
                  if node.name == 'BenchmarkReviewRecord':
                      node.body = [
                          item
                          for item in node.body
                          if not (
                              isinstance(item, ast.AnnAssign)
                              and isinstance(item.target, ast.Name)
                              and item.target.id in {'review_sequence', 'supersedes_review_id'}
                          )
                      ]
                  if node.name == 'BenchmarkPackage':
                      filtered: list[ast.stmt] = []
                      for item in node.body:
                          if (
                              isinstance(item, ast.AnnAssign)
                              and isinstance(item.target, ast.Name)
                              and item.target.id == 'change_records'
                          ):
                              continue
                          filtered.append(item)
                      node.body = filtered
                  return self.generic_visit(node)

              def visit_FunctionDef(self, node: ast.FunctionDef):
                  if node.name == '_effective_review_records':
                      return None
                  node = self.generic_visit(node)
                  # Remove only individual top-level statements inside a
                  # validator that depend on machine-history fields. The rest of
                  # the validator (referential integrity/scientific invariants)
                  # stays intact.
                  node.body = [
                      statement
                      for statement in node.body
                      if not source_has(statement, self.source, {'change_records', 'BenchmarkChangeRecord'})
                  ]
                  if not node.body:
                      node.body = [ast.Pass()]
                  return node

              def visit_Call(self, node: ast.Call):
                  node = self.generic_visit(node)
                  if (
                      isinstance(node.func, ast.Name)
                      and node.func.id == '_effective_review_records'
                      and len(node.args) == 1
                  ):
                      return node.args[0]
                  return node


          schema_path = ROOT / 'apps/api/src/app/schemas/paper_benchmark.py'
          source = schema_path.read_text(encoding='utf-8')
          tree = HistoryPruner(source).visit(ast.parse(source))
          ast.fix_missing_locations(tree)

          # Enforce exactly one current scientific review at the schema boundary
          # and bind it directly to current benchmark/scientific identities.
          package = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == 'BenchmarkPackage'
          )
          review_field = next(
              node for node in package.body
              if isinstance(node, ast.AnnAssign)
              and isinstance(node.target, ast.Name)
              and node.target.id == 'review_records'
          )
          if not isinstance(review_field.value, ast.Call):
              raise RuntimeError('BenchmarkPackage.review_records must use Field')
          keyword_names = {kw.arg for kw in review_field.value.keywords}
          if 'max_length' not in keyword_names:
              review_field.value.keywords.append(
                  ast.keyword(arg='max_length', value=ast.Constant(value=1))
              )

          validator_source = '''
@model_validator(mode="after")
def validate_current_scientific_review(self) -> Self:
    if len(self.review_records) != 1:
        raise ValueError("benchmark must contain exactly one current scientific review")
    review = self.review_records[0]
    if review.reviewed_benchmark_version != self.benchmark_version:
        raise ValueError("scientific review must bind the current benchmark version")
    if review.reviewed_content_hash != self.scientific_payload_hash:
        raise ValueError("scientific review must bind the current scientific payload hash")
    return self
'''
          validator = ast.parse(validator_source).body[0]
          package.body.append(validator)
          ast.fix_missing_locations(tree)
          transformed = ast.unparse(tree) + '\n'
          if any(token in transformed for token in HISTORY_TOKENS):
              raise RuntimeError('historical benchmark machinery remains after transform')
          ast.parse(transformed)
          schema_path.write_text(transformed, encoding='utf-8')

          benchmark_path = ROOT / 'services/paper_pipeline/benchmarks/exoplanet_host_star/paper-reasoning-benchmark.json'
          payload = json.loads(benchmark_path.read_text(encoding='utf-8'))
          reviews = payload.get('review_records')
          if not isinstance(reviews, list) or len(reviews) != 1:
              raise RuntimeError('benchmark must contain exactly one current scientific review')
          review = reviews[0]
          review.pop('review_sequence', None)
          review.pop('supersedes_review_id', None)
          payload.pop('change_records', None)
          if review['reviewed_benchmark_version'] != payload['benchmark_version']:
              raise RuntimeError('review benchmark identity mismatch')
          if review['reviewed_content_hash'] != payload['scientific_payload_hash']:
              raise RuntimeError('review scientific payload identity mismatch')

          # The current package content hash is canonical JSON excluding the hash
          # field itself. Verify that assumption against the handoff asset before
          # using it to recompute the current-only package hash.
          from hashlib import sha256

          original = json.loads(
              (ROOT / 'services/paper_pipeline/benchmarks/exoplanet_host_star/paper-reasoning-benchmark.json').read_text(encoding='utf-8')
          )
          def canonical_hash(value: dict[str, object]) -> str:
              projected = dict(value)
              projected.pop('content_hash', None)
              raw = json.dumps(
                  projected,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':'),
              ).encode('utf-8')
              return 'sha256:' + sha256(raw).hexdigest()

          # The original variable has already been logically transformed in
          # memory; recompute and let the authoring model/loader verify it below.
          payload['content_hash'] = canonical_hash(payload)
          benchmark_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # Remove only tests whose function body directly uses historical
          # benchmark machinery. Scientific data/review/admission tests remain.
          test_path = ROOT / 'apps/api/tests/test_paper_benchmark.py'
          test_source = test_path.read_text(encoding='utf-8')
          test_tree = ast.parse(test_source)
          lines = test_source.splitlines(keepends=True)
          replacements: list[tuple[int, int, str]] = []
          for node in test_tree.body:
              if isinstance(node, ast.ImportFrom):
                  names = [
                      alias for alias in node.names
                      if alias.name != 'BenchmarkChangeRecord'
                  ]
                  if len(names) != len(node.names):
                      replacement = (
                          ast.unparse(ast.ImportFrom(module=node.module, names=names, level=node.level)) + '\n'
                          if names else ''
                      )
                      replacements.append((node.lineno, node.end_lineno or node.lineno, replacement))
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and source_has(
                  node, test_source, HISTORY_TOKENS
              ):
                  replacements.append((node.lineno, node.end_lineno or node.lineno, ''))
          for start, end, replacement in sorted(replacements, reverse=True):
              lines[start - 1:end] = [replacement]
          updated = ''.join(lines)
          ast.parse(updated)
          test_path.write_text(updated, encoding='utf-8')

          # Retired transport read projections are historical baseline tests,
          # not current admission tests. Delete only whole test functions that
          # refer to their imported aliases; all other large pipeline suites are
          # preserved byte-for-byte from the handoff source.
          for relative in (
              'apps/api/tests/test_literature_claim_pipeline.py',
              'apps/api/tests/test_literature_relation_pipeline.py',
          ):
              path = ROOT / relative
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              retired_aliases: set[str] = set()
              replacements = []
              for node in tree.body:
                  if isinstance(node, ast.ImportFrom) and node.module in RETIRED_MODULES:
                      retired_aliases.update(alias.asname or alias.name for alias in node.names)
                      replacements.append((node.lineno, node.end_lineno or node.lineno, ''))
              if not retired_aliases:
                  continue
              handled: set[str] = set()
              for node in tree.body:
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  segment = ast.get_source_segment(source, node) or ''
                  used = {
                      alias for alias in retired_aliases
                      if re.search(rf'\b{re.escape(alias)}\b', segment)
                  }
                  if not used:
                      continue
                  allowed_name = any(
                      token in node.name
                      for token in ('read', 'projection', 'bypass', 'shape')
                  )
                  if not allowed_name:
                      raise RuntimeError(
                          f'{relative}:{node.lineno}: retired projection used by non-baseline test {node.name}'
                      )
                  handled.update(used)
                  replacements.append((node.lineno, node.end_lineno or node.lineno, ''))
              if handled != retired_aliases:
                  raise RuntimeError(
                      f'{relative}: unhandled retired aliases {sorted(retired_aliases - handled)}'
                  )
              lines = source.splitlines(keepends=True)
              for start, end, replacement in sorted(replacements, reverse=True):
                  lines[start - 1:end] = [replacement]
              updated = ''.join(lines)
              ast.parse(updated)
              path.write_text(updated, encoding='utf-8')

          # Structural documentation role: lifecycle metadata is not part of the
          # active tree. Vendored upstream source is excluded entirely.
          for path in ROOT.rglob('*.md'):
              posix = path.as_posix()
              if '.git' in path.parts or posix.startswith('apps/workspace/upstream/'):
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              reference = posix.startswith('docs/references/')
              kept = []
              for line in lines:
                  if re.match(r'^\|\s*(?:Status|Issue|Superseded by|Time range)\s*\|', line, re.I):
                      continue
                  if reference and re.match(r'^\|\s*Authority\s*\|', line, re.I):
                      continue
                  kept.append(line)
              updated = ''.join(kept)
              updated = updated.replace('VERSIONED_DATA_ARTIFACTS.md', 'DATA_ARTIFACTS.md')
              updated = updated.replace('Versioned Data Artifacts', 'Data Artifacts')
              updated = updated.replace('Versioned Evidence Graph Pipeline', 'Evidence Graph Pipeline')
              updated = updated.replace('Versioned Evidence Graph', 'Evidence Graph')
              path.write_text(updated, encoding='utf-8')

          for relative in (
              'packages/prompts/literature_reasoning/v1.md',
              'packages/prompts/paper_summary/v1.md',
              'services/data_pipeline/fixtures/exoplanet_host_star/nasa-toi-first-page.recorded.v1.json',
              'services/data_pipeline/manifests/exoplanet_host_star/quality-rules/quality-rules.v1.json',
              'services/data_pipeline/manifests/CHANGELOG.md',
              'services/paper_pipeline/benchmarks/CHANGELOG.md',
          ):
              target = ROOT / relative
              if target.exists():
                  target.unlink()

          # ArtifactVersion is immutable; deleting the current version is
          # rejected rather than attempting SET NULL through a composite FK that
          # also contains ResearchArtifact.id.
          for relative in (
              'apps/api/src/app/db/models.py',
              'apps/api/migrations/versions/schema_baseline.py',
          ):
              path = ROOT / relative
              text = path.read_text(encoding='utf-8')
              text = text.replace('ondelete="SET NULL"', 'ondelete="RESTRICT"')
              path.write_text(text, encoding='utf-8')

          # No active import may remain before deleting old transport projection
          # modules.
          for module in RETIRED_MODULES:
              hits = []
              for path in (ROOT / 'apps/api').rglob('*.py'):
                  if path.as_posix() in {
                      'apps/api/src/app/schemas/graph.py',
                      'apps/api/src/app/schemas/reasoning.py',
                  }:
                      continue
                  if module in path.read_text(encoding='utf-8', errors='ignore'):
                      hits.append(path.as_posix())
              if hits:
                  raise RuntimeError(f'{module} still imported by {hits}')
          for relative in (
              'apps/api/src/app/schemas/graph.py',
              'apps/api/src/app/schemas/reasoning.py',
          ):
              target = ROOT / relative
              if target.exists():
                  target.unlink()
          PY

      - name: Validate transformed sources before commit
        shell: bash
        run: |
          uv sync --project apps/api --frozen
          python -m compileall -q apps/api/src apps/api/tests
          PYTHONPATH=apps/api/src uv run --project apps/api python - <<'PY'
          from services.paper_pipeline.benchmark import load_frozen_benchmark

          package = load_frozen_benchmark()
          assert len(package.review_records) == 1
          review = package.review_records[0]
          assert review.reviewed_benchmark_version == package.benchmark_version
          assert review.reviewed_content_hash == package.scientific_payload_hash
          PY
          uv run --project apps/api pytest \
            apps/api/tests/test_paper_benchmark.py \
            apps/api/tests/test_literature_claim_pipeline.py \
            apps/api/tests/test_literature_relation_pipeline.py \
            -q
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            scripts/check-docs-rules.mjs \
            scripts/check-docs.mjs \
            scripts/check-docs.test.mjs \
            scripts/governance-identifiers.mjs \
            scripts/check-architecture-delegacy.mjs \
            scripts/check-architecture-delegacy.test.mjs \
            package.json \
            apps/site/package.json \
            apps/workspace/package.json \
            packages/design-tokens/package.json \
            packages/ui/package.json \
            packages/domain/package.json \
            packages/contracts/package.json \
            packages/data-access/package.json \
            packages/workspace-core/package.json \
            packages/testing/package.json \
            .github/workflows/ci.yml
          node --test scripts/check-docs.test.mjs scripts/check-architecture-delegacy.test.mjs
          node scripts/check-docs.mjs
          node scripts/check-architecture-delegacy.mjs
          git diff --check

      - name: Remove maintenance workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/final-delegacy-maintenance.yml
          rm -f .github/workflows/benchmark-current-maintenance.yml
          rm -f .github/workflows/repository-maintenance.yml
          rm -f .github/workflows/one-time-delegacy-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(repo): finalize current architecture closure"
          git push origin HEAD:codex/governance-authority-current-main
