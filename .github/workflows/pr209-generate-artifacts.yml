name: PR209 closure diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr209-generate-artifacts.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main

      - name: Report direct persistence fixture constructors
        run: |
          git grep -n -E 'Research(Project|ContractDraft|Contract)Model\(' -- apps/api/tests || true

      - name: Upload closure source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr209-closure-source
          if-no-files-found: error
          path: |
            apps/api/migrations/versions
            apps/api/src/app
            apps/api/tests
            docs/architecture/DATA_MODEL.md
            packages/contracts/src/generated/core
            packages/data-access/src/fixture/paper-acquisition.fixture.json
            packages/data-access/src/fixture/paper-summary.fixture.json
            packages/schemas/generated/core
            scripts
            services/paper_pipeline/benchmarks/exoplanet_host_star
