name: PR209 observable closure materializer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr209-materialize-observable.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/governance-authority-current-main'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xingwen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xingwen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/xingwen_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/xingwen_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-authority-current-main
          fetch-depth: 0

      - name: Apply verified review repair and remove repair machinery
        run: |
          cat scripts/.pr209-final-patch-1 scripts/.pr209-final-patch-2 scripts/.pr209-final-patch-3 \
            | base64 --decode | gzip --decompress > /tmp/pr209-final.patch
          git apply --check /tmp/pr209-final.patch
          git apply /tmp/pr209-final.patch
          git rm .github/workflows/pr209-materialize-observable.yml \
            scripts/.pr209-final-patch-1 \
            scripts/.pr209-final-patch-2 \
            scripts/.pr209-final-patch-3

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.8'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync locked API environment
        run: uv sync --project apps/api --frozen

      - name: Regenerate current machine contracts and fixtures
        shell: bash
        run: |
          uv run --project apps/api python -m services.paper_pipeline.demo_fixture
          uv run --project apps/api python -m services.paper_pipeline.demo_summary_fixture
          mapfile -t CORE_MODELS < <(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('packages/schemas/generated/core/manifest.json').read_text())
          for item in manifest['models']:
              print(item['name'])
          PY
          )
          mapfile -t GRAPH_MODELS < <(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('packages/schemas/generated/graph/manifest.json').read_text())
          for item in manifest['models']:
              print(item['name'])
          PY
          )
          CORE_ARGS=()
          for model in "${CORE_MODELS[@]}"; do CORE_ARGS+=(--include "$model"); done
          GRAPH_ARGS=()
          for model in "${GRAPH_MODELS[@]}"; do GRAPH_ARGS+=(--include "$model"); done
          cd apps/api
          uv run python ../../scripts/export_schemas.py \
            --output ../../packages/schemas/generated/core "${CORE_ARGS[@]}"
          uv run python ../../scripts/export_schemas.py \
            --output ../../packages/schemas/generated/graph "${GRAPH_ARGS[@]}" \
            --manifest-content-hashes
          uv run python ../../scripts/export_openapi.py \
            --output ../../packages/schemas/generated/core/openapi.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Sync frontend consumers and canonical formatting
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @xingwen/contracts sync-contracts
          pnpm exec prettier --write \
            packages/data-access/src/fixture/paper-acquisition.fixture.json \
            packages/data-access/src/fixture/paper-summary.fixture.json \
            packages/schemas/generated/core/openapi.json \
            scripts/check-architecture-delegacy.mjs \
            scripts/check-docs-rules.mjs \
            scripts/check-docs.mjs \
            scripts/check-docs.test.mjs \
            scripts/governance-identifiers.mjs

      - name: Validate persistence, API parity and benchmark contracts
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api pytest \
            apps/api/tests/*postgres*.py \
            apps/api/tests/test_api_surface.py \
            apps/api/tests/test_required_operation_parity.py \
            apps/api/tests/test_core_contract.py \
            apps/api/tests/test_paper_benchmark.py \
            apps/api/tests/test_graph_benchmark.py -q

      - name: Validate generated tree and governance
        shell: bash
        run: |
          mapfile -t CORE_MODELS < <(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('packages/schemas/generated/core/manifest.json').read_text())
          for item in manifest['models']:
              print(item['name'])
          PY
          )
          mapfile -t GRAPH_MODELS < <(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('packages/schemas/generated/graph/manifest.json').read_text())
          for item in manifest['models']:
              print(item['name'])
          PY
          )
          CORE_ARGS=()
          for model in "${CORE_MODELS[@]}"; do CORE_ARGS+=(--include "$model"); done
          GRAPH_ARGS=()
          for model in "${GRAPH_MODELS[@]}"; do GRAPH_ARGS+=(--include "$model"); done
          cd apps/api
          uv run python ../../scripts/export_schemas.py \
            --output ../../packages/schemas/generated/core "${CORE_ARGS[@]}" --check
          uv run python ../../scripts/export_schemas.py \
            --output ../../packages/schemas/generated/graph "${GRAPH_ARGS[@]}" \
            --manifest-content-hashes --check
          uv run python ../../scripts/export_openapi.py \
            --output ../../packages/schemas/generated/core/openapi.json --check
          cd ../..
          pnpm format:check
          node scripts/check-architecture-delegacy.mjs
          node scripts/check-docs.mjs
          python scripts/check_foundation.py
          git diff --check

      - name: Commit clean materialized tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(repo): close final governance review blockers'
          git push origin HEAD:codex/governance-authority-current-main
