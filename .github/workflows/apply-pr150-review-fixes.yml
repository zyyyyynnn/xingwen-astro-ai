name: Apply PR 150 review fixes

on:
  pull_request:
    types: [synchronize]
    paths:
      - scripts/apply_pr150_review_fixes.py
      - .github/workflows/apply-pr150-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 150 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/c-07-supplemental-source-adapter
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply review fixes
        run: python scripts/apply_pr150_review_fixes.py

      - name: Commit and push fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(data-pipeline): address supplemental adapter review"
          git push origin HEAD:codex/c-07-supplemental-source-adapter
