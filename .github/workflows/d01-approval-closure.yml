name: D-01 approval closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  close-d01:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/d01-approval-closure
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sync backend dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Record D-01 approval evidence
        working-directory: apps/api
        run: uv run python ../../.github/scripts/close_d01_approval.py

      - name: Adapt pending-only test fixtures
        run: python .github/scripts/fix_d01_closure_tests.py

      - name: Validate benchmark and backend
        working-directory: apps/api
        shell: bash
        run: |
          set +e
          output=$(uv run pytest tests/test_paper_benchmark.py -q --tb=short 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            compact=$(printf '%s' "$output" | tail -n 40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=D-01 benchmark test failure::$compact"
            exit "$status"
          fi
          uv run pytest
          uv run python ../../scripts/export_schemas.py --output ../../.artifacts/schemas
          uv run python ../../scripts/export_schemas.py --output ../../.artifacts/schemas --check

      - name: Validate repository foundation
        run: |
          python scripts/check_foundation.py
          git diff --check

      - name: Remove one-shot automation
        run: |
          rm .github/workflows/d01-approval-closure.yml
          rm .github/scripts/close_d01_approval.py
          rm .github/scripts/fix_d01_closure_tests.py

      - name: Commit generated closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record D-01 approval evidence"
          git push origin HEAD:chore/d01-approval-closure
