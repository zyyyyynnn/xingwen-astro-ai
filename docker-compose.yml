# Docker Compose 本地开发编排：品牌站、科研工作台、API 与 PostgreSQL。

services:
  postgres:
    image: postgres:17-alpine
    container_name: xingwen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xingwen_astro_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xingwen_astro_ai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: xingwen-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问 postgres；生产环境必须覆盖默认凭据。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-xingwen_astro_ai}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  site:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: xingwen-site
    restart: unless-stopped
    environment:
      PUBLIC_WORKSPACE_URL: ${PUBLIC_WORKSPACE_URL:-http://localhost:5173/workspace}
    ports:
      - "${SITE_PORT:-4321}:4321"
    command: ["pnpm", "--filter", "@xingwen/site", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  workspace:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: xingwen-workspace
    restart: unless-stopped
    environment:
      # 浏览器公开配置必须使用宿主机可访问地址，且不得包含密钥。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WORKSPACE_PORT:-5173}:5173"
    command: ["pnpm", "--filter", "@xingwen/workspace", "dev"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
