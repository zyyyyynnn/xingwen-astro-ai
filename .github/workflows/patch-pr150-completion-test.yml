name: Patch PR 150 completion test

on:
  pull_request:
    types: [synchronize]
    paths:
      - scripts/patch_pr150_completion_test.py
      - .github/workflows/patch-pr150-completion-test.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 150 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c-07-supplemental-source-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply and publish correction
        run: |
          python scripts/patch_pr150_completion_test.py
          rm scripts/patch_pr150_completion_test.py
          rm .github/workflows/patch-pr150-completion-test.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(data-pipeline): prove complete bounded pagination"
          git push origin HEAD:codex/c-07-supplemental-source-adapter
